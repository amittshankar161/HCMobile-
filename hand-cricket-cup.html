<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Cricket Cup</title>
<style>
:root{--bg:#14293a;--panel:#1f3a50;--chalk:#eef0f2;--ball:#d6402f;--wood:#c89b5b;--mute:#8fa5b6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--chalk);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 2px}h3{margin:18px 0 6px}
.sub,.note{color:var(--mute)}.sub{margin:0 0 14px}.note{font-size:14px}
button{font:inherit;color:var(--chalk);background:var(--panel);border:2px solid var(--mute);border-radius:10px;padding:12px;cursor:pointer}
button:active{transform:scale(.97)}button:disabled{opacity:.4}
button.main{background:var(--ball);border-color:var(--ball);font-weight:bold;width:100%;margin-top:8px;display:flex;justify-content:space-between}
.panel{background:var(--panel);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}
.tpr{font-size:30px;font-weight:bold;color:var(--wood)}
.opt{width:100%;text-align:left;margin:8px 0;display:flex;justify-content:space-between;align-items:center;border-left-width:8px}
.opt b{font-size:18px}.opt span{font-size:26px;font-weight:bold;color:var(--wood)}
.g90{border-left-color:#e6b84a}.g85{border-left-color:#c7ced4}.g0{border-left-color:#a06a3b}
.pl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #2c4a62}
.bd{position:relative;display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:bold;overflow:hidden;color:#fff}
.bd img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.vs{display:flex;justify-content:space-around;align-items:center;text-align:center;font-size:13px}
.score{display:flex;justify-content:space-around;background:var(--panel);border-radius:12px;padding:12px;margin:10px 0;text-align:center}
.score span{display:block;font-size:34px;font-weight:bold}
.status{text-align:center;min-height:50px;font-size:17px;margin:8px 0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nums button{font-size:28px;font-weight:bold;padding:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================
   DATA: edit freely. Player format: [name, role, rating]
   Ratings are made up and rosters may be out of date.
   Roles: BAT, WK, AR, BOWL
   ===================================================== */
const PLAYERS={
men:[
["Virat Kohli","BAT",94],["Rohit Sharma","BAT",92],["Shubman Gill","BAT",89],["Suryakumar Yadav","BAT",90],
["Travis Head","BAT",90],["Joe Root","BAT",91],["Babar Azam","BAT",88],["Kane Williamson","BAT",88],
["Rishabh Pant","WK",87],["Jos Buttler","WK",90],["Heinrich Klaasen","WK",90],["Sanju Samson","WK",85],
["Hardik Pandya","AR",87],["Ravindra Jadeja","AR",88],["Ben Stokes","AR",89],["Glenn Maxwell","AR",86],["Sunil Narine","AR",86],["Marcus Stoinis","AR",82],
["Jasprit Bumrah","BOWL",95],["Mitchell Starc","BOWL",89],["Pat Cummins","BOWL",90],["Rashid Khan","BOWL",91],["Kagiso Rabada","BOWL",88],
["Shaheen Afridi","BOWL",87],["Trent Boult","BOWL",87],["Kuldeep Yadav","BOWL",86],["Mohammed Siraj","BOWL",85]],
women:[
["Smriti Mandhana","BAT",91],["Beth Mooney","BAT",88],["Laura Wolvaardt","BAT",88],["Harmanpreet Kaur","BAT",87],
["Tammy Beaumont","BAT",85],["Chamari Athapaththu","BAT",86],["Shafali Verma","BAT",85],
["Alyssa Healy","WK",89],["Richa Ghosh","WK",84],["Amy Jones","WK",82],
["Ellyse Perry","AR",91],["Nat Sciver-Brunt","AR",91],["Ashleigh Gardner","AR",88],["Deepti Sharma","AR",86],["Hayley Matthews","AR",88],
["Sophie Ecclestone","BOWL",89],["Megan Schutt","BOWL",86],["Renuka Singh","BOWL",84],["Kim Garth","BOWL",82],
["Shabnim Ismail","BOWL",85],["Lauren Bell","BOWL",82],["Radha Yadav","BOWL",80]]};
// Teams: [name, code, TPR, colour]. Drop logos in a "logos" folder as CODE.png to show them.
const TEAMS={
men:[["India","IND",90,"#1a5fb4"],["Australia","AUS",88,"#c9a400"],["England","ENG",86,"#c01c28"],["South Africa","RSA",84,"#26a269"],
 ["Pakistan","PAK",83,"#1b6b3a"],["New Zealand","NZL",82,"#2a2a2a"],["Sri Lanka","SRI",76,"#1c3f94"],["West Indies","WIN",77,"#7a1f3d"]],
women:[["Australia","AUS",90,"#c9a400"],["England","ENG",85,"#c01c28"],["India","IND",84,"#1a5fb4"],["South Africa","RSA",82,"#26a269"],
 ["New Zealand","NZL",78,"#2a2a2a"],["West Indies","WIN",74,"#7a1f3d"],["Sri Lanka","SRI",70,"#1c3f94"],["Pakistan","PAK",68,"#1b6b3a"]],
ipl:[["Mumbai Indians","MI",85,"#1f6fb5"],["Chennai Super Kings","CSK",84,"#d9a800"],["Royal Challengers","RCB",83,"#b3202a"],["Kolkata Knight Riders","KKR",83,"#4b2a7a"],
 ["Sunrisers Hyderabad","SRH",82,"#d86a12"],["Rajasthan Royals","RR",80,"#d6338a"],["Gujarat Titans","GT",80,"#1c2c4c"],["Delhi Capitals","DC",79,"#1d4ed8"]]};
const COMPS={
men:{n:"Men's World Cup",pool:"men"},
women:{n:"Women's World Cup",pool:"women"},
ipl:{n:"IPL Cup",pool:"men"}};
const FORMS={
"Batting heavy":["BAT","BAT","BAT","BAT","BAT","WK","AR","AR","BOWL","BOWL","BOWL"],
"Balanced":["BAT","BAT","BAT","BAT","WK","AR","AR","BOWL","BOWL","BOWL","BOWL"],
"Bowling heavy":["BAT","BAT","BAT","WK","AR","AR","BOWL","BOWL","BOWL","BOWL","BOWL"]};
const ROLE={BAT:"Batter",WK:"Wicketkeeper",AR:"All-rounder",BOWL:"Bowler"};
const ROUNDS=["Quarter-final","Semi-final","Final"];

/* ---------- save / helpers ---------- */
const NEED={BAT:4,WK:1,AR:2,BOWL:4};   // your XI is the best owned players in this mix
let S={own:{men:[],women:[]},tr:{men:0,women:0,ipl:0},tokens:10};
try{const d=JSON.parse(localStorage.getItem("hc_cup2"));if(d)S=d}catch(e){}
const save=()=>{try{localStorage.setItem("hc_cup2",JSON.stringify(S))}catch(e){}};
const rate=xi=>Math.round(xi.reduce((s,p)=>s+p[2],0)/xi.length);
const rnd=()=>1+Math.floor(Math.random()*6);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const tier=o=>o>=90?"g90":o>=85?"g85":"g0";
const app=document.getElementById("app");
const badge=t=>`<span class="bd" style="background:${t[3]}">${t[1]}<img src="logos/${t[1]}.png" alt="" onerror="this.remove()"></span>`;
const bind=(sel,fn)=>app.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
// free starter players so you can play before you draft anyone
const STARTERS=[];
Object.keys(NEED).forEach(r=>{for(let i=0;i<NEED[r];i++)STARTERS.push([`Club ${ROLE[r]} ${i+1}`,r,62+i*2])});
const squad=g=>STARTERS.concat(PLAYERS[g].filter(p=>S.own[g].includes(p[0])));
const teamXI=g=>{let xi=[];for(const r in NEED)xi=xi.concat(squad(g).filter(p=>p[1]===r).sort((a,b)=>b[2]-a[2]).slice(0,NEED[r]));return xi};

/* ---------- HOME ---------- */
function home(){
  const nm=g=>g==="men"?"Men's":"Women's";
  app.innerHTML=`<h1>Hand Cricket Cup</h1><p class="sub">Draft stars. Build your team. Win the cups.</p>
  <div class="panel"><span class="tpr" style="font-size:20px">Draft tokens: ${S.tokens}</span>
  <p class="note" style="margin:4px 0 0">Win matches to earn more tokens.</p></div>
  ${["men","women"].map(g=>`<div class="panel"><b>${nm(g)} Team</b><div class="tpr">TPR ${rate(teamXI(g))}</div>
   <p class="note">Stars collected: ${S.own[g].length}/${PLAYERS[g].length}</p>
   <div class="row"><button data-d="${g}:1:1" ${S.tokens<1?"disabled":""}>Draft 1<br><small>1 token</small></button>
   <button data-d="${g}:10:9" ${S.tokens<9?"disabled":""}>Draft 10<br><small>9 tokens</small></button>
   <button data-v="${g}">Squad</button></div></div>`).join("")}
  <h3>Cups</h3>
  ${Object.keys(COMPS).map(k=>`<button class="main" data-c="${k}"><span>${COMPS[k].n}</span><small>Trophies: ${S.tr[k]}</small></button>`).join("")}
  <p class="note">Online play needs a server. That is the next stage.</p>`;
  bind("[data-d]",b=>{const[g,n,c]=b.dataset.d.split(":");draft(g,+n,+c)});
  bind("[data-v]",b=>teamView(b.dataset.v));
  bind("[data-c]",b=>cupStart(b.dataset.c));
}
function teamView(g){
  const xi=teamXI(g), names=xi.map(p=>p[0]);
  const bench=squad(g).filter(p=>!names.includes(p[0]));
  const row=p=>`<div class="pl"><span>${p[0]} <small class="note">${ROLE[p[1]]}</small></span><b>${p[2]}</b></div>`;
  app.innerHTML=`<h1>${g==="men"?"Men's":"Women's"} Team</h1><div class="tpr">TPR ${rate(xi)}</div>
  <h3>Playing XI</h3>${xi.map(row).join("")}
  ${bench.length?`<h3>Bench</h3>${bench.map(row).join("")}`:""}
  <button class="main" id="b"><span>Back</span></button>`;
  document.getElementById("b").onclick=home;
}

/* ---------- DRAFT: 1 token = 1 random player, 9 tokens = 10 ---------- */
function draft(g,n,cost){
  if(S.tokens<cost)return;
  const before=rate(teamXI(g));S.tokens-=cost;const pulls=[];
  for(let i=0;i<n;i++){
    const pool=PLAYERS[g].filter(p=>!S.own[g].includes(p[0]));
    if(!pool.length)break;
    // stars are rarer: lower rating = higher chance
    const w=pool.map(p=>101-p[2]);
    let r=Math.random()*w.reduce((x,y)=>x+y,0),pick=pool[pool.length-1];
    for(let j=0;j<pool.length;j++){r-=w[j];if(r<=0){pick=pool[j];break}}
    S.own[g].push(pick[0]);pulls.push(pick);
  }
  S.tokens+=Math.round(cost*(n-pulls.length)/n);save();
  app.innerHTML=`<h1>Draft result</h1>
  ${pulls.length?pulls.map(p=>`<div class="opt ${tier(p[2])}"><b>${p[0]}<br><small class="note">${ROLE[p[1]]}</small></b><span>${p[2]}</span></div>`).join(""):`<p class="note">You already own every star. Tokens refunded.</p>`}
  <div class="panel">TPR ${before} to <b class="tpr" style="font-size:22px">${rate(teamXI(g))}</b></div>
  <button class="main" id="b"><span>Back</span></button>`;
  document.getElementById("b").onclick=home;
}

/* ---------- CUP ---------- */
let R,M;
function cupStart(k){
  const me=rate(teamXI(COMPS[k].pool));
  const opps=shuffle(TEAMS[k]).slice(0,3).sort((a,b)=>a[2]-b[2]);
  R={k,me,opps,stage:0};nextMatch();
}
function nextMatch(){
  const o=R.opps[R.stage];
  M={opp:o,oppT:o[2],inn:1,you:0,cpu:0,target:0,cpuNext:rnd(),over:false,
     log:`${ROUNDS[R.stage]} vs ${o[0]}. You bat first. Match the computer and you're out.`};
  matchDraw();
}
function matchDraw(){
  const m=M;
  app.innerHTML=`<div class="vs"><div><span class="bd" style="background:#555">YOU</span><br>TPR ${R.me}</div>
  <b>${ROUNDS[R.stage]}</b><div>${badge(m.opp)}<br>${m.opp[0]}<br>TPR ${m.oppT}</div></div>
  <div class="score"><div>You<span>${m.you}</span></div>
  <div>${m.inn===2?"Target<span>"+m.target+"</span>":"<span>&nbsp;</span>"}</div>
  <div>${m.opp[1]}<span>${m.cpu}</span></div></div>
  <p class="note" style="text-align:center">${m.inn===1?"You are batting":"You are bowling"}</p>
  <div class="status">${m.log}</div>
  ${m.over?`<button class="main" id="nx">${m.won&&R.stage<2?"Next match":"Back to menu"}</button>`:
  `<div class="nums">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}">${n}</button>`).join("")}</div>`}`;
  bind("[data-n]",b=>play(+b.dataset.n));
  const nx=document.getElementById("nx");
  if(nx)nx.onclick=()=>{if(M.won&&R.stage<2){R.stage++;nextMatch()}else home()};
}
// chance a side's batters survive a dismissal; stronger TPR survives more
const save_=(a,b)=>Math.min(.5,Math.max(.05,.1+(a-b)/100));
function play(n){
  const m=M,c=m.cpuNext;
  if(m.inn===1){
    if(n===c){
      if(Math.random()<save_(R.me,m.oppT))m.log=`Both showed ${n}. Out! But your batters survived on TPR.`;
      else{m.inn=2;m.target=m.you+1;m.log=`Both showed ${n}. OUT for ${m.you}. ${m.opp[0]} need ${m.target}. You bowl now.`}
    }else{m.you+=n;m.log=`You ${n}, ${m.opp[1]} ${c}. +${n} runs.`}
  }else{
    if(n===c){
      if(Math.random()<save_(m.oppT,R.me))m.log=`Both showed ${n}. ${m.opp[0]} survived on TPR!`;
      else return end(true,`Both showed ${n}. ${m.opp[0]} are OUT. You win!`);
    }else{
      m.cpu+=c;m.log=`You ${n}, ${m.opp[1]} ${c}. They score ${c}.`;
      if(m.cpu>=m.target)return end(false,`${m.opp[0]} reached ${m.cpu}. You are knocked out.`);
    }
  }
  m.cpuNext=rnd();matchDraw();
}
function end(won,txt){
  M.over=true;M.won=won;M.log=txt;
  if(won){S.tokens++;M.log+=" +1 draft token."}
  if(won&&R.stage===2){S.tr[R.k]++;S.tokens+=2;M.log+=` You won the ${COMPS[R.k].n}! +2 bonus tokens.`}
  save();
  matchDraw();
}
home();
</script>
</body>
</html>
